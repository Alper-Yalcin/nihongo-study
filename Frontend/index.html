<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>
      (function () {
        var storageKeys = ['kototsuna.theme-mode', 'kotonoha.theme-mode'];
        var savedTheme = null;

        for (var index = 0; index < storageKeys.length; index += 1) {
          var rawValue = null;

          try {
            rawValue = window.localStorage.getItem(storageKeys[index]);
          } catch (error) {
            rawValue = null;
          }

          if (rawValue === 'light' || rawValue === 'dark') {
            savedTheme = rawValue;
            break;
          }
        }

        var prefersDark =
          typeof window.matchMedia === 'function' &&
          window.matchMedia('(prefers-color-scheme: dark)').matches;
        var theme = savedTheme || (prefersDark ? 'dark' : 'light');
        var root = document.documentElement;

        root.classList.remove('theme-light', 'theme-dark');
        root.classList.add(theme === 'dark' ? 'theme-dark' : 'theme-light');
      })();
    </script>
    <link rel="icon" type="image/png" href="/logo/kotonohaFacivon.png" />
    <link rel="shortcut icon" href="/logo/kotonohaFacivon.png" />
    <meta name="theme-color" content="#d06070" />
    <title>Kototsuna</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
